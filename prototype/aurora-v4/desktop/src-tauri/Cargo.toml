[package]
name = "aurora-v4-desktop"
version = "0.1.0"
description = "Project Aurora v4 desktop prototype"
authors = ["Project Aurora"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "aurora_v4_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
